<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polybound</title>
    <meta name="description" content="A tactical two-player polyomino game on a 14×14 grid. Claim the neutral zone, hop enemy walls with bridge pieces, and out-think the AI." />
    <meta name="theme-color" content="#020617" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600;700&display=swap');
      :root { color-scheme: dark; }
      body {
        font-family: 'Inter', sans-serif;
        background: radial-gradient(ellipse at top, #0f172a 0%, #020617 60%);
        background-color: #020617;
        color: #f8fafc;
        min-height: 100vh;
        -webkit-tap-highlight-color: transparent;
      }
      .font-orbitron { font-family: 'Orbitron', sans-serif; }
      .glass-card {
        background: rgba(30, 41, 59, 0.45);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      kbd {
        font-family: 'Orbitron', sans-serif; font-size: 10px; padding: 1px 5px; border-radius: 4px;
        background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      }
      .rule-h { font-weight: 700; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.15em; margin-bottom: 0.25rem; color: white; }

      /* Ambient background */
      .bg-grid {
        background-image:
          linear-gradient(rgba(148,163,184,0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148,163,184,0.05) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      }
      .orb { position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%; filter: blur(80px); opacity: 0.18; }
      .orb-red { background: #ef4444; bottom: -30vmax; left: -20vmax; animation: drift 18s ease-in-out infinite alternate; }
      .orb-blue { background: #3b82f6; top: -30vmax; right: -20vmax; animation: drift 22s ease-in-out infinite alternate-reverse; }
      @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(6vmax, -4vmax); } }

      .title-glow { filter: drop-shadow(0 0 25px rgba(148,163,184,0.25)); }
      .float-slow { animation: float 5s ease-in-out infinite; }
      @keyframes float { 50% { transform: translateY(-6px); } }
      .start-btn { box-shadow: 0 10px 40px rgba(255,255,255,0.15); }
      .start-btn:hover { background: #eff6ff; box-shadow: 0 10px 50px rgba(147,197,253,0.35); }

      /* Board */
      .board-frame {
        background: linear-gradient(145deg, rgba(30,41,59,0.7), rgba(2,6,23,0.8));
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
      }
      .piece-drop { transform-box: fill-box; transform-origin: center; animation: drop 0.35s cubic-bezier(.2,1.4,.4,1) both; }
      @keyframes drop { from { transform: scale(1.35); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      .piece-last { animation: drop 0.35s cubic-bezier(.2,1.4,.4,1) both, last-glow 1.8s ease-in-out 0.35s infinite; }
      @keyframes last-glow {
        0%, 100% { filter: drop-shadow(0 0 2px var(--glow)); }
        50% { filter: drop-shadow(0 0 9px var(--glow)) brightness(1.15); }
      }
      .neutral-pulse { animation: neutral 3.5s ease-in-out infinite; }
      @keyframes neutral { 50% { opacity: 0.12; } }
      .anchor-blink { animation: anchor 2.2s ease-in-out infinite; }
      @keyframes anchor { 50% { opacity: 0.2; } }
      .preview-valid { animation: preview 1s ease-in-out infinite; }
      @keyframes preview { 50% { fill-opacity: 0.4; } }

      /* Tray & controls */
      .tray { background: rgba(15, 23, 42, 0.55); border: 1px solid rgba(255,255,255,0.07); backdrop-filter: blur(12px); }
      .piece-btn { transition: transform 0.2s, background 0.2s, box-shadow 0.2s; }
      .piece-btn:hover { transform: translateY(-2px); }
      .piece-btn.selected { transform: translateY(-3px) scale(1.06); box-shadow: 0 0 24px var(--accent); }
      .ctrl-btn { background: rgba(30,41,59,0.45); border: 1px solid rgba(255,255,255,0.08); }
      .ctrl-btn:hover { background: rgba(51,65,85,0.6); }

      .score-card { background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.06); transition: all 0.3s; }
      .score-card.active { border-color: var(--accent-solid); box-shadow: 0 0 22px var(--accent), inset 0 0 12px var(--accent); }
      .score-pop { animation: score-pop 0.4s ease-out; }
      @keyframes score-pop { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }

      .turn-bar {
        background: linear-gradient(90deg, transparent, var(--accent-solid) 20%, var(--accent-solid) 80%, transparent);
        box-shadow: 0 -8px 30px color-mix(in srgb, var(--accent-solid) 35%, transparent);
        transition: background 0.4s;
        text-shadow: 0 1px 2px rgba(0,0,0,0.4);
      }
      .thinking-dot { width: 6px; height: 6px; border-radius: 9999px; background: #60a5fa; animation: bounce-dot 0.9s ease-in-out infinite; }
      @keyframes bounce-dot { 50% { transform: translateY(-4px); opacity: 0.4; } }

      /* Generic transitions */
      .fade-in { animation: fade-in 0.3s ease-out both; }
      @keyframes fade-in { from { opacity: 0; } }
      .pop-in { animation: pop-in 0.4s cubic-bezier(.2,1.3,.4,1) both; }
      @keyframes pop-in { from { opacity: 0; transform: scale(0.9); } }
      .rise-in { animation: rise-in 0.6s ease-out both; }
      @keyframes rise-in { from { opacity: 0; transform: translateY(14px); } }
      .toast { animation: toast 2.2s ease-out both; }
      @keyframes toast {
        0% { opacity: 0; transform: translate(-50%, -8px); }
        10%, 80% { opacity: 1; transform: translate(-50%, 0); }
        100% { opacity: 0; transform: translate(-50%, -4px); }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
      }

      .custom-scrollbar::-webkit-scrollbar { height: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.5); }
    </style>
</head>
  <body>
    <div id="root"></div>
    <!-- Entry point for the Vite build process -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
